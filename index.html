<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="트레이닝 로그">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B1F23">
<link rel="manifest" href="manifest.json">
<title>김상필 트레이닝 로그</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#1B1F23;
    --surface:#242A2F;
    --surface-2:#2C333A;
    --surface-3:#333B43;
    --ink:#F2F0EA;
    --ink-dim:#93A0A8;
    --ink-faint:#5E6A72;
    --accent-a:#E8A33D;
    --accent-a-dim:#4A3B24;
    --accent-b:#4FA8A0;
    --accent-b-dim:#20393B;
    --accent-pt:#C1666B;
    --accent-pt-dim:#3A2529;
    --border:rgba(242,240,234,0.10);
    --border-strong:rgba(242,240,234,0.20);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:640px;margin:0 auto;padding:20px 16px 80px;}

  /* Header */
  .header{margin-bottom:18px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.16em;
    color:var(--ink-faint);
    text-transform:uppercase;
    margin:0 0 2px;
  }
  h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:38px;
    letter-spacing:.02em;
    margin:0;
    line-height:1;
  }
  .sub{color:var(--ink-dim);font-size:13px;margin-top:6px;}

  /* Weekly rotation board — signature element */
  .board{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin:18px 0 22px;
  }
  .day-chip{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 2px 7px;
    text-align:center;
    position:relative;
  }
  .day-chip.today{border-color:var(--border-strong);box-shadow:0 0 0 1px var(--border-strong) inset;}
  .day-chip .dname{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--ink-dim);
  }
  .day-chip .dtag{
    font-family:'Bebas Neue',sans-serif;
    font-size:14px;
    letter-spacing:.03em;
    margin-top:3px;
  }
  .day-chip.pt .dtag{color:var(--accent-pt);}
  .day-chip.free .dtag{color:var(--ink-faint);}
  .day-chip .dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--accent-a);
    margin:5px auto 0;
    visibility:hidden;
  }
  .day-chip .dot.on{visibility:visible;}

  /* Tabs */
  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--border);}
  .tab{
    flex:1;text-align:center;padding:10px 4px;
    font-size:13.5px;font-weight:600;color:var(--ink-faint);
    cursor:pointer;border-bottom:2px solid transparent;
    transition:color .15s;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--accent-a);}

  .panel{display:none;}
  .panel.active{display:block;}

  /* Cards */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}

  label.field-label{
    font-size:12px;color:var(--ink-dim);
    display:block;margin-bottom:6px;
  }
  input[type=date]{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    padding:9px 10px;
    border-radius:8px;
    width:100%;
  }

  .daytype-banner{
    display:flex;align-items:center;gap:10px;
    padding:14px;border-radius:12px;
    margin-bottom:14px;
  }
  .daytype-banner.pt{background:var(--accent-pt-dim);border:1px solid rgba(193,102,107,.35);}
  .daytype-banner.free{background:var(--surface-2);border:1px solid var(--border);}
  .daytype-banner .big{
    font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.02em;
  }
  .daytype-banner.pt .big{color:var(--accent-pt);}
  .daytype-banner p{margin:2px 0 0;font-size:12.5px;color:var(--ink-dim);}

  .group-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .routine-toggle{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .rbtn{
    flex:1 1 30%;min-width:90px;padding:12px 10px;border-radius:12px;
    border:1px solid var(--border);background:var(--surface-2);cursor:pointer;text-align:left;
  }
  .rbtn .glabel{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.02em;}
  .rbtn .gsub{font-size:11px;color:var(--ink-dim);margin-top:2px;}
  .rbtn.manage-routines{flex:0 0 auto;min-width:60px;text-align:center;color:var(--ink-dim);font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;}

  /* Manage modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .modal{
    background:var(--bg);border:1px solid var(--border-strong);border-radius:16px 16px 0 0;
    width:100%;max-width:640px;max-height:85vh;display:flex;flex-direction:column;
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--border);}
  .modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.02em;}
  .modal-close{background:none;border:none;color:var(--ink-dim);font-size:13px;cursor:pointer;text-decoration:underline;}
  .modal-tabs{display:flex;gap:6px;padding:0 18px;border-bottom:1px solid var(--border);}
  .mtab{flex:1;text-align:center;padding:11px 4px;font-size:13px;font-weight:600;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;}
  .mtab.active{color:var(--ink);border-bottom-color:var(--accent-a);}
  .modal-body{overflow-y:auto;padding:16px 18px 28px;}
  .mpanel{display:none;} .mpanel.active{display:block;}

  .routine-block{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
  .routine-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .routine-block-head .rname{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.02em;}
  .routine-block-head .rdel{background:none;border:none;color:var(--ink-faint);font-size:12px;cursor:pointer;text-decoration:underline;}
  .ex-check{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);cursor:pointer;}
  .ex-check:first-of-type{border-top:none;}
  .ex-check .cbox{
    width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border-strong);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#1B1F23;
  }
  .ex-check.on .cbox{background:var(--accent-a);border-color:var(--accent-a);}
  .ex-check .exlabel{font-size:13.5px;}
  .ex-check .expart{font-size:11px;color:var(--ink-faint);margin-left:auto;}

  .add-inline{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .add-inline input{flex:1 1 100%;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:10px 11px;font-size:13.5px;font-family:'IBM Plex Sans KR',sans-serif;}
  .add-inline .part-in{flex:1 1 0;min-width:0;}
  .add-inline button{flex:0 0 auto;border:none;border-radius:8px;background:var(--accent-a);color:#1B1F23;font-weight:700;font-size:13.5px;padding:10px 18px;cursor:pointer;white-space:nowrap;}
  .add-inline .second-row{display:flex;gap:8px;flex:1 1 100%;}

  .master-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);}
  .master-item:first-of-type{border-top:none;}
  .master-item .mname{font-size:13.5px;}
  .master-item .mpart{font-size:11px;color:var(--ink-faint);}
  .master-item .mdel{margin-left:auto;background:none;border:none;color:var(--ink-faint);font-size:16px;cursor:pointer;}
  .master-item .mdel:hover{color:var(--accent-pt);}
  .section-label{font-size:12px;color:var(--ink-dim);margin:0 0 8px;}

  .gbtn{
    flex:1;padding:12px 10px;border-radius:12px;
    border:1px solid var(--border);background:var(--surface-2);
    cursor:pointer;text-align:left;
  }
  .gbtn .glabel{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.02em;}
  .gbtn .gsub{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
  .gbtn.selA{border-color:var(--accent-a);background:var(--accent-a-dim);}
  .gbtn.selA .glabel{color:var(--accent-a);}
  .gbtn.selB{border-color:var(--accent-b);background:var(--accent-b-dim);}
  .gbtn.selB .glabel{color:var(--accent-b);}
  .suggest-tag{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-faint);
    letter-spacing:.05em;margin-bottom:8px;text-transform:uppercase;
  }

  .exercise{
    border-top:1px solid var(--border);
    padding-top:12px;margin-top:12px;
  }
  .exercise:first-child{border-top:none;margin-top:0;padding-top:0;}
  .exercise .ename{font-size:14.5px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
  .ex-del{background:none;border:none;color:var(--ink-faint);font-size:16px;cursor:pointer;padding:0 4px;line-height:1;}
  .ex-del:hover{color:var(--accent-pt);}

  .add-ex-toggle{
    margin-top:14px;text-align:center;font-size:12.5px;color:var(--ink-dim);
    padding:10px;border:1px dashed var(--border-strong);border-radius:10px;cursor:pointer;
  }
  .add-ex-toggle:hover{color:var(--ink);}
  .add-ex-panel{margin-top:10px;}
  .add-ex-panel input[type=text]{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);
    border-radius:8px;padding:10px 11px;font-size:13.5px;font-family:'IBM Plex Sans KR',sans-serif;
    margin-bottom:8px;
  }
  .add-ex-btns{display:flex;gap:8px;}
  .add-ex-btn{
    flex:1;padding:10px 6px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--ink-dim);font-size:12.5px;cursor:pointer;
    font-family:'IBM Plex Sans KR',sans-serif;font-weight:600;
  }
  .add-ex-btn.selA:active,.add-ex-btn.selA:hover{border-color:var(--accent-a);color:var(--accent-a);}
  .add-ex-btn.selB:active,.add-ex-btn.selB:hover{border-color:var(--accent-b);color:var(--accent-b);}
  .sets{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center;}
  .sets .setno{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);
    width:16px;
  }
  .sets input{
    background:var(--surface-2);border:1px solid var(--border);
    color:var(--ink);border-radius:8px;padding:8px 9px;
    font-family:'IBM Plex Mono',monospace;font-size:13.5px;width:100%;
  }
  .sets input::placeholder{color:var(--ink-faint);}
  .colhead{font-size:10px;color:var(--ink-faint);text-align:left;font-family:'IBM Plex Mono',monospace;}

  .wgs-row{display:flex;gap:8px;margin-top:6px;}
  .setchk{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    padding:9px 4px;cursor:pointer;font-size:12.5px;color:var(--ink-dim);
  }
  .setchk.on{border-color:var(--accent-a);color:var(--accent-a);background:var(--accent-a-dim);}

  /* Water tracker */
  .water-card{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:16px;margin-bottom:14px;
  }
  .water-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .water-top .wt-label{font-size:13px;color:var(--ink-dim);}
  .water-top .wt-ml{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-faint);}
  .water-counter{display:flex;align-items:center;justify-content:center;gap:22px;}
  .wbtn{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--border-strong);
    background:var(--surface-2);color:var(--ink);font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .wbtn:active{background:var(--surface-3);}
  .wcount{font-family:'Bebas Neue',sans-serif;font-size:44px;color:#6FB8DE;min-width:70px;text-align:center;}
  .wcount-unit{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:-4px;}

  .cardio-row{display:flex;align-items:center;gap:10px;}
  .cardio-row input[type=number]{
    background:var(--surface-2);border:1px solid var(--border);color:var(--ink);
    border-radius:8px;padding:9px 10px;font-family:'IBM Plex Mono',monospace;
    font-size:13.5px;width:80px;
  }
  .toggle{
    width:40px;height:23px;border-radius:20px;background:var(--surface-3);
    position:relative;cursor:pointer;flex-shrink:0;
  }
  .toggle.on{background:var(--accent-b);}
  .toggle .knob{
    width:17px;height:17px;border-radius:50%;background:var(--ink);
    position:absolute;top:3px;left:3px;transition:left .15s;
  }
  .toggle.on .knob{left:20px;}

  textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--border);
    color:var(--ink);border-radius:10px;padding:10px 11px;
    font-family:'IBM Plex Sans KR',sans-serif;font-size:13px;
    resize:vertical;min-height:56px;
  }

  .save-btn{
    width:100%;padding:14px;border:none;border-radius:12px;
    background:var(--accent-a);color:#1B1F23;
    font-size:15px;font-weight:700;cursor:pointer;
    font-family:'IBM Plex Sans KR',sans-serif;
  }
  .save-btn:active{opacity:.85;}
  .save-btn.pt-mode{background:var(--accent-pt);}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--surface-3);border:1px solid var(--border-strong);
    padding:10px 18px;border-radius:20px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  /* History */
  .hist-entry{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:14px 16px;margin-bottom:10px;
  }
  .hist-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .hist-date{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-dim);}
  .hist-tag{
    font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.02em;
    padding:2px 9px;border-radius:6px;
  }
  .hist-tag.A{background:var(--accent-a-dim);color:var(--accent-a);}
  .hist-tag.B{background:var(--accent-b-dim);color:var(--accent-b);}
  .hist-tag.PT{background:var(--accent-pt-dim);color:var(--accent-pt);}
  .hist-body{margin-top:10px;font-size:13px;color:var(--ink-dim);line-height:1.7;}
  .hist-body b{color:var(--ink);font-weight:600;}
  .hist-note{
    margin-top:8px;padding-top:8px;border-top:1px solid var(--border);
    font-size:12.5px;color:var(--ink-dim);font-style:normal;
  }
  .del-btn{
    background:none;border:none;color:var(--ink-faint);font-size:12px;
    cursor:pointer;padding:2px 4px;
  }
  .del-btn:hover{color:var(--accent-pt);}
  .empty{
    text-align:center;color:var(--ink-faint);font-size:13px;padding:40px 10px;
  }

  /* Graph */
  .select-wrap{margin-bottom:14px;}
  select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);
    color:var(--ink);border-radius:10px;padding:11px 12px;font-size:14px;
    font-family:'IBM Plex Sans KR',sans-serif;
  }
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .stat-row{display:flex;gap:10px;margin-top:14px;}
  .stat{flex:1;background:var(--surface-2);border-radius:10px;padding:10px;text-align:center;}
  .stat .v{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--accent-a);}
  .stat .l{font-size:10.5px;color:var(--ink-faint);margin-top:2px;}

  @media (max-width:380px){
    .app{padding:16px 12px 80px;}
    h1{font-size:32px;}
    .day-chip{padding:7px 1px 6px;}
    .day-chip .dtag{font-size:12px;}
    .day-chip .dname{font-size:10px;}
    .gbtn .glabel{font-size:17px;}
    .wcount{font-size:38px;}
    .sets input{padding:7px 6px;font-size:12.5px;}
  }

  /* Login screen */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .login-card{
    width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);
    border-radius:16px;padding:28px 22px;
  }
  .login-card h2{
    font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.02em;margin:0 0 4px;
  }
  .login-card p{color:var(--ink-dim);font-size:12.5px;margin:0 0 18px;}
  .login-card input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);
    border-radius:8px;padding:11px 12px;font-size:14px;margin-bottom:10px;
    font-family:'IBM Plex Sans KR',sans-serif;
  }
  .login-card button{
    width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent-a);
    color:#1B1F23;font-weight:700;font-size:14.5px;cursor:pointer;margin-top:4px;
  }
  .login-err{color:var(--accent-pt);font-size:12px;margin-top:10px;min-height:14px;}
  #appRoot{display:none;}
  .logout-btn{
    font-size:11px;color:var(--ink-faint);cursor:pointer;text-decoration:underline;
    text-align:right;margin-bottom:6px;
  }

  /* History: summary + filter + month accordion */
  .summary-row{display:flex;gap:8px;margin-bottom:14px;}
  .summary-card{
    flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:12px 8px;text-align:center;
  }
  .summary-card .sv{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent-a);line-height:1;}
  .summary-card .sl{font-size:10.5px;color:var(--ink-faint);margin-top:4px;}
  .filter-bar{display:flex;gap:6px;margin-bottom:14px;}
  .fbtn{
    flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-size:12.5px;font-weight:600;
    border:1px solid var(--border);background:var(--surface-2);color:var(--ink-dim);cursor:pointer;
  }
  .fbtn.on{border-color:var(--accent-a);color:var(--accent-a);background:var(--accent-a-dim);}
  .month-group{margin-bottom:12px;}
  .month-head{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
    padding:11px 14px;cursor:pointer;user-select:none;
  }
  .month-head .mtitle{font-weight:600;font-size:14px;}
  .month-head .mcount{font-size:12px;color:var(--ink-dim);}
  .month-head .chev{color:var(--ink-faint);font-size:12px;transition:transform .15s;}
  .month-group.open .chev{transform:rotate(90deg);}
  .month-body{display:none;padding-top:10px;}
  .month-group.open .month-body{display:block;}

  /* InBody */
  .ib-upload{
    border:1.5px dashed var(--border-strong);border-radius:12px;padding:22px 14px;
    text-align:center;cursor:pointer;background:var(--surface-2);
  }

<script>
// ====== Firebase 설정 ======
// Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱 에서 복사해서 아래에 그대로 붙여넣으세요.
const firebaseConfig = {
  apiKey: "AIzaSyDB-qmTWEIPhdKc9xdcvBk6sjaXLSwIgOY",
  authDomain: "training-log-377f4.firebaseapp.com",
  projectId: "training-log-377f4",
  storageBucket: "training-log-377f4.firebasestorage.app",
  messagingSenderId: "286910060476",
  appId: "1:286910060476:web:4f93133b6348aaba557db9"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let docRef = null; // set after login, users/{uid}/log/data

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPw').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  try{
    await auth.signInWithEmailAndPassword(email, pw);
  }catch(e){
    errEl.textContent = '로그인 실패: 이메일 또는 비밀번호를 확인하세요.';
  }
});
document.getElementById('logoutBtn').addEventListener('click', ()=>{ auth.signOut(); });

auth.onAuthStateChanged(async (user)=>{
  if(user){
    docRef = db.collection('users').doc(user.uid).collection('log').doc('data');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appRoot').style.display = 'block';
    await bootApp();
  }else{
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('appRoot').style.display = 'none';
  }
});

// ====== 데이터 모델 ======
// masterExercises: 모든 종목의 마스터 목록 [{id, name, part}]
// routines: 루틴 목록 [{id, label, sub, color, exerciseIds:[...]}]
const DEFAULT_MASTER = [
  {id:'bench',    name:'벤치프레스',      part:'가슴'},
  {id:'ohp',      name:'오버헤드프레스',  part:'어깨'},
  {id:'pushdown', name:'케이블 푸쉬다운', part:'삼두'},
  {id:'row',      name:'인버티드로우',    part:'등'},
  {id:'latpull',  name:'암풀다운',        part:'등'},
  {id:'squat',    name:'가블릿스쿼트',    part:'하체'},
];
const DEFAULT_ROUTINES = [
  {id:'A', label:'A', sub:'가슴 · 어깨 · 삼두', color:'#E8A33D', exerciseIds:['bench','ohp','pushdown']},
  {id:'B', label:'B', sub:'등 · 이두 · 하체', color:'#4FA8A0', exerciseIds:['row','latpull','squat']},
];
const ROUTINE_COLORS = ['#E8A33D','#4FA8A0','#A78BD4','#C1666B','#6FB8DE','#8FBF66'];

let masterExercises = [];
let routines = [];

function exById(id){ return masterExercises.find(e=>e.id===id) || null; }
function routineById(id){ return routines.find(r=>r.id===id) || null; }
function routineExercises(routineId){
  const r = routineById(routineId);
  if(!r) return [];
  return r.exerciseIds.map(exById).filter(Boolean);
}
function allExercises(){ return masterExercises; }

const CUP_ML = 165;
let water = {}; // { 'YYYY-MM-DD': count }
let inbody = []; // [{date, weight, smm, bfm, bmi, pbf}]
const PT_DAYS = [2,5]; // Tue, Fri (0=Sun)
const DAY_NAMES = ['일','월','화','수','목','금','토'];

let entries = [];
let selectedRoutine = null; // routine id
let wgsChecks = [false,false,false];
let cardioOn = false;

async function persistConfig(){
  try{ await docRef.set({ masterExercises, routines }, { merge:true }); }
  catch(e){ console.error('config save failed', e); }
}
async function addMasterExercise(name, part){
  const id = 'ex-' + Date.now();
  masterExercises.push({ id, name, part: part||'' });
  await persistConfig();
  return id;
}
async function removeMasterExercise(id){
  masterExercises = masterExercises.filter(e=>e.id!==id);
  routines.forEach(r=>{ r.exerciseIds = r.exerciseIds.filter(eid=>eid!==id); });
  await persistConfig();
}
async function addRoutine(label, sub){
  const id = 'r-' + Date.now();
  const color = ROUTINE_COLORS[routines.length % ROUTINE_COLORS.length];
  routines.push({ id, label, sub: sub||'', color, exerciseIds:[] });
  await persistConfig();
  return id;
}
async function removeRoutine(id){
  routines = routines.filter(r=>r.id!==id);
  if(selectedRoutine===id) selectedRoutine = routines[0] ? routines[0].id : null;
  await persistConfig();
}
async function toggleExerciseInRoutine(routineId, exId){
  const r = routineById(routineId);
  if(!r) return;
  if(r.exerciseIds.includes(exId)) r.exerciseIds = r.exerciseIds.filter(x=>x!==exId);
  else r.exerciseIds.push(exId);
  await persistConfig();
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dayOfWeek(dateStr){
  return new Date(dateStr+'T00:00:00').getDay();
}
function isPTDay(dateStr){
  return PT_DAYS.includes(dayOfWeek(dateStr));
}

async function loadAllData(){
  let data = {};
  try{
    const snap = await docRef.get();
    data = snap.exists ? snap.data() : {};
    entries = data.entries || [];
    water = data.water || {};
    inbody = data.inbody || [];
  }catch(e){
    console.error('load failed', e);
    entries = []; water = {}; inbody = [];
  }

  // ----- 종목/루틴 로드 + 구버전 마이그레이션 -----
  if(Array.isArray(data.masterExercises) && Array.isArray(data.routines)){
    masterExercises = data.masterExercises;
    routines = data.routines;
  }else{
    // 새 사용자거나 구버전(customExercises) 데이터 → 기본값 + 마이그레이션
    masterExercises = DEFAULT_MASTER.map(e=>({...e}));
    routines = DEFAULT_ROUTINES.map(r=>({...r, exerciseIds:[...r.exerciseIds]}));
    const legacy = data.customExercises || [];
    legacy.forEach(c=>{
      // 구버전 커스텀 종목 이름에서 "n. " 접두어 제거
      const cleanName = c.name.replace(/^\d+\.\s*/, '');
      masterExercises.push({ id:c.id, name:cleanName, part:'' });
      const r = routines.find(x=>x.id===c.group);
      if(r && !r.exerciseIds.includes(c.id)) r.exerciseIds.push(c.id);
    });
    // 과거 entries에 등장하지만 마스터에 없는 종목도 흡수(그래프/기록 유지용)
    entries.forEach(en=>{
      (en.exercises||[]).forEach(ex=>{
        if(!masterExercises.find(m=>m.id===ex.id)){
          masterExercises.push({ id:ex.id, name:ex.name.replace(/^\d+\.\s*/, ''), part:'' });
        }
      });
    });
    await persistConfig();
  }
  if(!selectedRoutine && routines[0]) selectedRoutine = routines[0].id;
}

async function persistEntries(){
  try{ await docRef.set({ entries }, { merge:true }); }
  catch(e){ console.error('save failed', e); }
}

async function persistWater(){
  try{ await docRef.set({ water }, { merge:true }); }
  catch(e){ console.error('water save failed', e); }
}
async function persistInbody(){
  try{ await docRef.set({ inbody }, { merge:true }); }
  catch(e){ console.error('inbody save failed', e); }
}
function renderWaterCounter(){
  const dateStr = document.getElementById('dateInput').value;
  const count = water[dateStr] || 0;
  document.getElementById('waterCount').textContent = count;
  document.getElementById('waterMl').textContent = (count*CUP_ML) + 'ml';
}
async function changeWater(delta){
  const dateStr = document.getElementById('dateInput').value;
  const next = Math.max(0, (water[dateStr]||0) + delta);
  water[dateStr] = next;
  await persistWater();
  renderWaterCounter();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---------- Week board ----------
function renderWeekBoard(){
  const board = document.getElementById('weekBoard');
  board.innerHTML = '';
  const todayDow = new Date().getDay();
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay()+6)%7));
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    const dow = d.getDay();
    const dstr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const pt = PT_DAYS.includes(dow);
    const hasEntry = entries.some(e=>e.date===dstr);
    const chip = document.createElement('div');
    chip.className = 'day-chip ' + (pt?'pt':'free') + (dow===todayDow?' today':'');
    chip.innerHTML = `<div class="dname">${DAY_NAMES[dow]}</div><div class="dtag">${pt?'PT':'개인'}</div><div class="dot ${hasEntry?'on':''}"></div>`;
    board.appendChild(chip);
  }
}

// ---------- Tabs ----------
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
    if(tab.dataset.tab==='history') renderHistory();
    if(tab.dataset.tab==='graph') renderGraph();
    if(tab.dataset.tab==='inbody') renderInbody();
  });
});

// ---------- Log panel ----------
function lastRoutineId(){
  const past = entries.filter(e=>!e.pt && e.date!==document.getElementById('dateInput').value).sort((a,b)=>b.date.localeCompare(a.date));
  return past.length ? (past[0].routineId || past[0].group || null) : null;
}
function suggestRoutine(){
  // 직전 루틴 다음 순번의 루틴을 제안 (순환)
  if(!routines.length) return null;
  const last = lastRoutineId();
  const idx = routines.findIndex(r=>r.id===last);
  if(idx === -1) return routines[0].id;
  return routines[(idx+1) % routines.length].id;
}
function entryForDate(dateStr){
  return entries.find(e=>e.date===dateStr) || null;
}

function renderDayTypeAndForm(){
  const dateStr = document.getElementById('dateInput').value;
  const pt = isPTDay(dateStr);
  const banner = document.getElementById('daytypeBanner');
  const groupWrap = document.getElementById('groupToggleWrap');
  const exCard = document.getElementById('exerciseCard');
  const saveBtn = document.getElementById('saveBtn');
  const existing = entryForDate(dateStr);

  // common fields: WGS / cardio / note
  wgsChecks = existing && existing.wgs ? [...existing.wgs] : [false,false,false];
  cardioOn = !!(existing && existing.cardio != null);
  document.getElementById('cardioToggle').classList.toggle('on', cardioOn);
  document.getElementById('cardioMin').value = (existing && existing.cardio) ? existing.cardio : '';
  document.getElementById('noteInput').value = existing ? (existing.note||'') : '';
  renderWgsRow();

  if(pt){
    banner.innerHTML = `<div class="daytype-banner pt"><div><div class="big">PT 받는 날</div><p>선생님과 세션 진행 · 개인운동은 쉬고 WGS스트레칭만 기록하세요</p></div></div>`;
    groupWrap.innerHTML = '';
    exCard.style.display = 'none';
    saveBtn.classList.add('pt-mode');
    saveBtn.textContent = 'PT일 기록 저장';
  }else{
    banner.innerHTML = `<div class="daytype-banner free"><div><div class="big" style="color:var(--ink);">개인운동 날</div><p>아래에서 루틴을 고르고 종목별로 기록하세요</p></div></div>`;
    saveBtn.classList.remove('pt-mode');
    saveBtn.textContent = '기록 저장';
    exCard.style.display = 'block';
    const existingRoutine = existing && (existing.routineId || existing.group);
    selectedRoutine = (existingRoutine && routineById(existingRoutine)) ? existingRoutine : suggestRoutine();
    renderRoutineToggle();
    renderExercises();
    prefillExerciseInputs(existing);
  }
}

function renderRoutineToggle(){
  const wrap = document.getElementById('groupToggleWrap');
  const suggested = suggestRoutine();
  const suggestedLabel = suggested ? (routineById(suggested)?.label||'') : '';
  let html = `<div class="suggest-tag">추천 로테이션 &rarr; ${suggestedLabel} 루틴</div><div class="routine-toggle">`;
  routines.forEach(r=>{
    const sel = r.id===selectedRoutine;
    html += `
      <div class="rbtn ${sel?'sel':''}" data-rid="${r.id}" style="${sel?`border-color:${r.color};background:${r.color}22;`:''}">
        <div class="glabel" style="${sel?`color:${r.color};`:''}">${r.label}</div>
        <div class="gsub">${r.sub||''}</div>
      </div>`;
  });
  html += `<div class="rbtn manage-routines" id="manageRoutinesBtn">⚙︎<div class="gsub">루틴 관리</div></div>`;
  html += `</div>`;
  wrap.innerHTML = html;
  wrap.querySelectorAll('.rbtn[data-rid]').forEach(btn=>{
    btn.onclick = ()=>{ selectedRoutine = btn.dataset.rid; renderRoutineToggle(); renderExercises(); autoSave(); };
  });
  document.getElementById('manageRoutinesBtn').onclick = openManageModal;
}

function renderExercises(){
  const list = document.getElementById('exerciseList');
  list.innerHTML = '';
  const exs = routineExercises(selectedRoutine);
  if(!exs.length){
    list.innerHTML = `<div class="empty" style="padding:20px 6px;">이 루틴에 담긴 종목이 없어요.<br>아래 "루틴 관리 · 종목 편집"에서 종목을 담아보세요.</div>`;

// ---------- Auto-save (survives backgrounding / accidental close) ----------
function buildEntryFromForm(){
  const dateStr = document.getElementById('dateInput').value;
  const pt = isPTDay(dateStr);
  const note = document.getElementById('noteInput').value.trim();
  const cardioMin = document.getElementById('cardioMin').value;

  let exData = [];
  if(!pt){
    exData = routineExercises(selectedRoutine).map(ex=>{
      const sets = [1,2,3].map(n=>{
        const wEl = document.querySelector(`input[data-ex="${ex.id}"][data-field="weight"][data-set="${n}"]`);
        const rEl = document.querySelector(`input[data-ex="${ex.id}"][data-field="reps"][data-set="${n}"]`);
        const w = wEl ? wEl.value : '';
        const r = rEl ? rEl.value : '';
        return { weight: w?parseFloat(w):null, reps: r?parseInt(r):null };
      });
      return { id: ex.id, name: ex.name, sets };
    });
  }

  const existing = entryForDate(dateStr);
  const routine = routineById(selectedRoutine);
  return {
    id: existing ? existing.id : (Date.now()+'-'+Math.random().toString(36).slice(2,7)),
    date: dateStr,
    pt: pt,
    routineId: pt ? null : selectedRoutine,
    group: pt ? null : (routine ? routine.label : selectedRoutine), // 기록 보기 태그 표시용
    exercises: exData,
    wgs: [...wgsChecks],
    cardio: cardioOn ? (cardioMin?parseInt(cardioMin):0) : null,
    note: note
  };
}

let autoSaveTimer = null;
function debouncedAutoSave(){
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(autoSave, 400);
}
async function autoSave(){
  clearTimeout(autoSaveTimer);
  const entry = buildEntryFromForm();
  entries = entries.filter(e=>e.date!==entry.date); // one record per date, merged
  entries.push(entry);
  await persistEntries();
  renderWeekBoard();
}

function entryCardHTML(e){

      return `<div><b>${ex.name}</b> ${setsTxt||'<span style="color:var(--ink-faint);">기록 없음</span>'}</div>`;
    }).join('');
  }
  const wgsDone = e.wgs ? e.wgs.filter(Boolean).length : 0;
  const w = water[e.date] || 0;
  body += `<div style="margin-top:6px;"><b>WGS스트레칭</b> ${wgsDone}/3세트${e.cardio!=null?` · <b>러닝머신</b> ${e.cardio}분`:''}</div>`;
  body += `<div style="margin-top:2px;"><b>💧 수분</b> ${w}잔 (${w*CUP_ML}ml)</div>`;
  return `
    <div class="hist-entry">

      </div>

    </div>`;
}

  const thisMonth = entries.filter(e=>e.date.startsWith(ym));

  const ptCount = thisMonth.filter(e=>e.pt).length;

function renderHistoryFilter(){
  const wrap = document.getElementById('historyFilter');
  const opts = [['all','전체'],['A','A'],['B','B'],['PT','PT']];
  wrap.innerHTML = opts.map(([v,l])=>`<div class="fbtn ${historyFilter===v?'on':''}" data-f="${v}">${l}</div>`).join('');
  wrap.querySelectorAll('.fbtn').forEach(btn=>{
    btn.onclick = ()=>{ historyFilter = btn.dataset.f; renderHistory(); };
  });

function renderHistory(){
  renderHistorySummary();
  renderHistoryFilter();
  const wrap = document.getElementById('historyList');
  let list = [...entries].sort((a,b)=>b.date.localeCompare(a.date));
  if(historyFilter==='PT') list = list.filter(e=>e.pt);
  else if(historyFilter==='A') list = list.filter(e=>!e.pt && e.group==='A');
  else if(historyFilter==='B') list = list.filter(e=>!e.pt && e.group==='B');

  if(!list.length){
    wrap.innerHTML = '<div class="empty">해당하는 기록이 없어요.</div>';
    return;
  }

  // group by month
  const byMonth = {};
  list.forEach(e=>{
    const ym = e.date.slice(0,7); // YYYY-MM
    (byMonth[ym] = byMonth[ym] || []).push(e);
  });
  const months = Object.keys(byMonth).sort((a,b)=>b.localeCompare(a));
  // default: newest month open
  if(Object.keys(openMonths).length===0 && months.length) openMonths[months[0]] = true;

  wrap.innerHTML = months.map(ym=>{
    const [y,m] = ym.split('-');
    const isOpen = !!openMonths[ym];
    const cards = byMonth[ym].map(entryCardHTML).join('');
    return `
      <div class="month-group ${isOpen?'open':''}" data-ym="${ym}">
        <div class="month-head">
          <span class="mtitle">${y}년 ${parseInt(m)}월</span>
          <span><span class="mcount">${byMonth[ym].length}건</span> <span class="chev">▶</span></span>
        </div>
        <div class="month-body">${cards}</div>
      </div>`;
  }).join('');

  wrap.querySelectorAll('.month-head').forEach(head=>{
    head.onclick = ()=>{
      const ym = head.parentElement.dataset.ym;
      openMonths[ym] = !openMonths[ym];
      head.parentElement.classList.toggle('open', openMonths[ym]);
    };
  });
  wrap.querySelectorAll('.del-btn').forEach(btn=>{
    btn.onclick = async (ev)=>{
      ev.stopPropagation();
      entries = entries.filter(e=>e.id!==btn.dataset.id);
      await persistEntries();
      renderHistory();
      renderWeekBoard();
    };
  });
}

document.getElementById('ibFile').addEventListener('change', async (e)=>{

  status.textContent = '사진에서 숫자를 읽는 중... (10~20초)';

  try{
    const url = URL.createObjectURL(file);
    // 왼쪽 값 컬럼만 잘라 인식률을 높인다
    const cropped = await cropLeftColumn(url);
    const { data } = await Tesseract.recognize(cropped, 'eng', {
      tessedit_char_whitelist: '0123456789.'
    });
    const parsed = parseInbodyText(data.text);
    if(Object.keys(parsed).length){
      // 날짜도 원본에서 시도
      const dateGuess = await tryReadDate(url);
      if(dateGuess) document.getElementById('ibDate').value = dateGuess;
      renderIbFields(parsed);
      status.textContent = '✓ 읽었어요. 값이 맞는지 확인하고 저장하세요.';
    }else{
      status.textContent = '숫자를 잘 못 읽었어요. 직접 입력해주세요.';
    }
    URL.revokeObjectURL(url);
  }catch(err){
    console.error(err);
    status.textContent = '인식 실패. 직접 입력해주세요.';
  }
});

// 이미지 왼쪽 42% 컬럼만 크롭 (큰 숫자들이 있는 영역)
function cropLeftColumn(url){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const cw = Math.floor(img.width*0.45);
      const canvas = document.createElement('canvas');
      // 2배 확대 + 그레이스케일로 인식률 향상
      canvas.width = cw*2; canvas.height = img.height*2;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0,0, cw,img.height, 0,0, cw*2,img.height*2);
      const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
      const d = imgData.data;
      for(let i=0;i<d.length;i+=4){
        const g = 0.3*d[i]+0.59*d[i+1]+0.11*d[i+2];
        d[i]=d[i+1]=d[i+2]=g;
      }
      ctx.putImageData(imgData,0,0);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = url;
  });
}

// OCR 텍스트에서 값 5개 추출: 각 줄 첫 소수 중 "0.0"(변화값) 제외
function parseInbodyText(text){
  const keys = ['weight','smm','bfm','bmi','pbf'];
  const vals = [];
  text.split('\n').forEach(line=>{
    const m = line.match(/(\d{1,3}\.\d)/);
    if(m && m[1] !== '0.0') vals.push(parseFloat(m[1]));
  });
  const out = {};
  keys.forEach((k,i)=>{ if(vals[i]!=null) out[k]=vals[i]; });
  return out;
}

// 날짜 읽기 시도 (오른쪽 상단 2026.07.06 형태)
async function tryReadDate(url){
  try{
    const { data } = await Tesseract.recognize(url, 'eng', { tessedit_char_whitelist:'0123456789.' });
    const m = data.text.match(/(20\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
    if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  }catch(e){}
  return null;
}

    type:'line',
    data:{ labels: points.map(p=>p.date.slice(5)),
      datasets:[{ label:meta.label, data:points.map(p=>p[metric]),
        borderColor:'#4FA8A0', backgroundColor:'rgba(79,168,160,0.15)',
        tension:0.3, fill:true, pointRadius:3, pointBackgroundColor:'#4FA8A0' }] },
    options:{ plugins:{legend:{display:false}},
      scales:{ x:{ticks:{color:'#93A0A8',font:{family:'IBM Plex Mono'}},grid:{color:'rgba(242,240,234,0.06)'}},
               y:{ticks:{color:'#93A0A8',font:{family:'IBM Plex Mono'}},grid:{color:'rgba(242,240,234,0.06)'}} } }
  });
  const first=points[0][metric], last=points[points.length-1][metric];
  const diff = (last-first);
  statRow.innerHTML = `
    <div class="stat"><div class="v">${last}${meta.unit}</div><div class="l">최근</div></div>
    <div class="stat"><div class="v">${first}${meta.unit}</div><div class="l">처음</div></div>
    <div class="stat"><div class="v">${diff>=0?'+':''}${diff.toFixed(1)}${meta.unit}</div><div class="l">변화</div></div>
  `;
}

function renderIbHistory(){
  const wrap = document.getElementById('ibHistory');
  const sorted = [...inbody].sort((a,b)=>b.date.localeCompare(a.date));
  if(!sorted.length){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = '<p class="section-label" style="margin-bottom:8px;">측정 기록</p>' + sorted.map(r=>{
    const vals = IB_METRICS.filter(m=>r[m.key]!=null).map(m=>`${m.label} <b>${r[m.key]}${m.unit}</b>`).join(' · ');
    return `<div class="ib-hist-item">
      <span class="ib-hist-date">${r.date}</span>
      <span class="ib-hist-vals">${vals}</span>
      <button class="del-btn" data-ibdate="${r.date}">삭제</button>
    </div>`;
  }).join('');
  wrap.querySelectorAll('.del-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      inbody = inbody.filter(r=>r.date!==btn.dataset.ibdate);
      await persistInbody();
      renderIbChart();
      renderIbHistory();
    };
  });
}

// ---------- Graph ----------
let chartInstance = null;
function populateExerciseSelect(){
  const sel = document.getElementById('exerciseSelect');
  sel.innerHTML = allExercises().map(ex=>`<option value="${ex.id}">${ex.name}</option>`).join('');
}
function renderGraph(){
  const sel = document.getElementById('exerciseSelect');
  const all = allExercises();
  const exId = sel.value || (all[0] && all[0].id);
  const points = [];
  entries.filter(e=>!e.pt).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const ex = e.exercises.find(x=>x.id===exId);
    if(!ex) return;
    const weights = ex.sets.map(s=>s.weight).filter(w=>w!=null);
    if(!weights.length) return;
    points.push({ date:e.date, top: Math.max(...weights) });
  });

  const ctx = document.getElementById('progressChart').getContext('2d');
  if(chartInstance) chartInstance.destroy();

  const statRow = document.getElementById('statRow');
  if(!points.length){
    statRow.innerHTML = '';
    chartInstance = new Chart(ctx, { type:'line', data:{labels:[],datasets:[]},
      options:{plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}}} });
    ctx.canvas.parentElement.insertAdjacentHTML('beforeend','');
    document.getElementById('progressChart').insertAdjacentHTML('afterend','');
    statRow.innerHTML = '<div class="empty" style="width:100%;">이 운동에 대한 기록이 아직 없어요.</div>';
    return;
  }

  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: points.map(p=>p.date.slice(5)),
      datasets: [{
        label: '최고 세트 무게(kg)',
        data: points.map(p=>p.top),
        borderColor: '#E8A33D',
        backgroundColor: 'rgba(232,163,61,0.15)',
        tension: 0.3,
        fill: true,
        pointRadius: 3,
        pointBackgroundColor: '#E8A33D'
      }]
    },
    options: {
      plugins: { legend: { display:false } },
      scales: {
        x: { ticks:{color:'#93A0A8', font:{family:'IBM Plex Mono'}}, grid:{color:'rgba(242,240,234,0.06)'} },
        y: { ticks:{color:'#93A0A8', font:{family:'IBM Plex Mono'}}, grid:{color:'rgba(242,240,234,0.06)'} }
      }
    }
  });

  const first = points[0].top, last = points[points.length-1].top, max = Math.max(...points.map(p=>p.top));
  statRow.innerHTML = `
    <div class="stat"><div class="v">${last}kg</div><div class="l">최근 기록</div></div>
    <div class="stat"><div class="v">${max}kg</div><div class="l">최고 기록</div></div>
    <div class="stat"><div class="v">${last-first>=0?'+':''}${(last-first).toFixed(1)}kg</div><div class="l">전체 변화</div></div>
  `;
}
document.getElementById('exerciseSelect').addEventListener('change', renderGraph);

// ---------- Init ----------
async function bootApp(){
  await loadAllData();
  renderWeekBoard();
  renderDayTypeAndForm();
  renderWaterCounter();
  renderWgsRow();
  populateExerciseSelect();
}
</script>
