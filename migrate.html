<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사진 이사 도구 · 트레이닝 로그</title>
<style>
  :root{ --bg:#14181B; --card:#1C2226; --ink:#F2F0EA; --ink-dim:#93A0A8; --line:rgba(242,240,234,0.10);
         --accent:#E8A33D; --ok:#8FBF66; --warn:#C1666B; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:20px;line-height:1.6;}
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--ink-dim);font-size:13px;margin:0 0 20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--accent);letter-spacing:0.02em;}
  input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:#111518;color:var(--ink);font-size:15px;margin-bottom:8px;}
  button{width:100%;padding:13px;border-radius:9px;border:none;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;background:#2A3238;color:var(--ink);}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  button.primary{background:var(--accent);color:#14181B;}
  button.go{background:var(--ok);color:#14181B;}
  button.danger{background:var(--warn);color:#fff;}
  .log{background:#0E1215;border:1px solid var(--line);border-radius:9px;padding:12px;font-family:'IBM Plex Mono',Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:340px;overflow:auto;color:var(--ink-dim);}
  .log b{color:var(--ink);}
  .log .g{color:var(--ok);}
  .log .r{color:var(--warn);}
  .hide{display:none;}
  .note{font-size:12.5px;color:var(--ink-dim);margin:6px 0 0;}
  .bar{height:8px;background:#0E1215;border-radius:5px;overflow:hidden;margin-top:10px;}
  .bar i{display:block;height:100%;background:var(--accent);width:0%;transition:width .2s;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📦 사진 이사 도구</h1>
  <p class="sub">문서 안에 박혀 있던 사진을 Firebase Storage로 옮기고, 문서에는 주소만 남깁니다. · v1</p>

  <div class="card" id="loginCard">
    <h2>1. 로그인</h2>
    <input type="email" id="email" placeholder="이메일" autocomplete="username">
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password">
    <button class="primary" id="loginBtn">로그인</button>
    <p class="note" id="loginErr"></p>
  </div>

  <div class="card hide" id="workCard">
    <h2>2. 작업</h2>
    <button id="scanBtn">🔍 조사만 하기 (아무것도 안 바꿈)</button>
    <button id="backupBtn">💾 백업 JSON 내려받기</button>
    <button class="go" id="oneBtn" disabled>🐣 딱 1장만 시험 이전 (정찰)</button>
    <button class="primary" id="allBtn" disabled>🚚 나머지 전부 이전</button>
    <div class="bar"><i id="bar"></i></div>
    <p class="note">순서대로 하세요: 조사 → 백업 → 1장 시험 → 전부. 중간에 멈춰도 다시 눌러 이어서 할 수 있어요.</p>
  </div>

  <div class="card hide" id="restoreCard">
    <h2>⚠️ 비상용 되돌리기</h2>
    <p class="note">문제가 생겼을 때만 쓰세요. 내려받아둔 백업 JSON으로 문서를 통째로 되돌립니다.</p>
    <input type="file" id="restoreFile" accept="application/json,.json">
    <button class="danger" id="restoreBtn">♻️ 백업에서 되돌리기</button>
  </div>

  <div class="card">
    <h2>기록</h2>
    <div class="log" id="log">로그인을 먼저 해주세요.</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDB-qmTWEIPhdKc9xdcvBk6sjaXLSwIgOY",
  authDomain: "training-log-377f4.firebaseapp.com",
  projectId: "training-log-377f4",
  storageBucket: "training-log-377f4.firebasestorage.app",
  messagingSenderId: "286910060476",
  appId: "1:286910060476:web:4f93133b6348aaba557db9"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();
let docRef = null, uid = null;

const logEl = document.getElementById('log');
function log(msg, cls){
  logEl.innerHTML += (cls ? '<span class="' + cls + '">' : '') + msg + (cls ? '</span>' : '') + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog(){ logEl.innerHTML = ''; }
function setBar(p){ document.getElementById('bar').style.width = Math.round(p*100) + '%'; }
function kb(b){ return (b/1024).toFixed(0) + 'KB'; }

// ---- 로그인 ----
document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const err = document.getElementById('loginErr');
  err.textContent = '';
  try{
    await auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(), document.getElementById('pw').value);
  }catch(e){ err.textContent = '로그인 실패: ' + e.message; }
});
auth.onAuthStateChanged(function(u){
  if(!u) return;
  uid = u.uid;
  docRef = db.collection('users').doc(uid).collection('log').doc('data');
  document.getElementById('loginCard').classList.add('hide');
  document.getElementById('workCard').classList.remove('hide');
  document.getElementById('restoreCard').classList.remove('hide');
  clearLog();
  log('로그인 완료. UID: ' + uid);
  log('먼저 [조사만 하기]를 눌러주세요.');
});

// ---- 공통 ----
const isDataUrl = v => typeof v === 'string' && v.startsWith('data:');
const approxBytes = s => Math.floor(s.length * 0.75);
const SLOTS = ['breakfast','lunch','dinner','snack'];
const SLOT_KO = { breakfast:'아침', lunch:'점심', dinner:'저녁', snack:'간식' };

async function fetchDoc(){
  const snap = await docRef.get();
  if(!snap.exists) throw new Error('문서가 없습니다.');
  return snap.data();
}

// 문서 안의 dataURL 사진 위치를 전부 찾아낸다 (읽기 전용)
function findPhotos(data){
  const items = [];
  const meals = data.meals || {};
  Object.keys(meals).sort().forEach(function(date){
    SLOTS.forEach(function(slot){
      (meals[date][slot] || []).forEach(function(v, i){
        if(isDataUrl(v)) items.push({ kind:'meal', date:date, slot:slot, idx:i, bytes:approxBytes(v) });
      });
    });
  });
  (data.inbody || []).forEach(function(r, i){
    if(isDataUrl(r.image)) items.push({ kind:'inbody', date:r.date, idx:i, bytes:approxBytes(r.image) });
  });
  return items;
}
function getPhoto(data, it){
  return it.kind === 'meal' ? data.meals[it.date][it.slot][it.idx] : data.inbody[it.idx].image;
}
function setPhoto(data, it, url){
  if(it.kind === 'meal') data.meals[it.date][it.slot][it.idx] = url;
  else data.inbody[it.idx].image = url;
}
function label(it){
  return it.kind === 'meal' ? ('식단 ' + it.date + ' ' + SLOT_KO[it.slot]) : ('인바디 ' + it.date);
}

// ---- 조사 (읽기 전용) ----
document.getElementById('scanBtn').addEventListener('click', async ()=>{
  clearLog();
  try{
    log('문서를 읽는 중…');
    const data = await fetchDoc();
    const docBytes = JSON.stringify(data).length;
    const items = findPhotos(data);
    const total = items.reduce(function(s, i){ return s + i.bytes; }, 0);
    const mealN = items.filter(function(i){ return i.kind === 'meal'; }).length;
    const ibN = items.filter(function(i){ return i.kind === 'inbody'; }).length;

    log('\n<b>현재 문서 크기: ' + kb(docBytes) + ' / 한도 1024KB (' + (docBytes/1048576*100).toFixed(1) + '% 사용)</b>');
    log('문서에 박혀 있는 사진: <b>' + items.length + '장</b>, 합계 약 <b>' + kb(total) + '</b>');
    log('  · 식단 ' + mealN + '장 / 인바디 ' + ibN + '장');
    log('\n이사 후 예상 문서 크기: 약 <b>' + kb(Math.max(0, docBytes - total) + items.length*150) + '</b>');
    log('\n--- 목록 ---');
    items.forEach(function(it, n){ log(String(n+1).padStart(3) + '. ' + label(it) + '  (' + kb(it.bytes) + ')'); });
    log('\n<b>아무것도 바꾸지 않았습니다.</b>', 'g');
    log('다음: [백업 JSON 내려받기] → [1장만 시험 이전]');

    document.getElementById('oneBtn').disabled = items.length === 0;
    document.getElementById('allBtn').disabled = items.length === 0;
    if(items.length === 0) log('\n옮길 사진이 없습니다. 이미 이사가 끝났거나 사진이 없어요.', 'g');
  }catch(e){ log('조사 실패: ' + e.message, 'r'); console.error(e); }
});

// ---- 백업 ----
document.getElementById('backupBtn').addEventListener('click', async ()=>{
  try{
    const data = await fetchDoc();
    const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
    const d = new Date();
    const stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0')
                + '-' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0');
    const a = document.createElement('a');
    const href = URL.createObjectURL(blob);
    a.href = href;
    a.download = 'training-log-backup-' + stamp + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(href); }, 5000);
    log('\n백업 내려받기 완료: ' + a.download + ' (' + kb(blob.size) + ')', 'g');
  }catch(e){ log('백업 실패: ' + e.message, 'r'); }
});

// ---- 실제 이사 ----
function storagePathFor(it){
  const rand = Math.random().toString(36).slice(2,8);
  const kind = it.kind === 'meal' ? 'meals' : 'inbody';
  return 'users/' + uid + '/' + kind + '/' + it.date + '_' + Date.now() + '_' + rand + '.jpg';
}

async function migrate(limit){
  clearLog();
  setBar(0);
  document.getElementById('oneBtn').disabled = true;
  document.getElementById('allBtn').disabled = true;
  try{
    log('문서를 다시 읽는 중… (조사 이후 바뀌었을 수 있어서)');
    const data = await fetchDoc();
    const all = findPhotos(data);
    const items = (limit == null) ? all : all.slice(0, limit);
    if(!items.length){ log('옮길 사진이 없습니다.', 'g'); return; }
    log(items.length + '장을 옮깁니다.\n');

    let done = 0, failed = 0;
    for(const it of items){
      try{
        const dataUrl = getPhoto(data, it);
        const ref = storage.ref().child(storagePathFor(it));
        await ref.putString(dataUrl, 'data_url');
        const url = await ref.getDownloadURL();
        setPhoto(data, it, url);
        done++;
        log('✓ ' + label(it) + ' → 이사 완료 (' + kb(it.bytes) + ')', 'g');
      }catch(e){
        failed++;
        log('✗ ' + label(it) + ' → 실패: ' + e.message, 'r');
        console.error(e);
      }
      setBar((done + failed) / items.length);
    }

    if(done > 0){
      log('\n문서에 주소를 기록하는 중…');
      // 사진이 들어있는 두 항목만 저장한다 (entries/water/masterExercises 등은 건드리지 않음)
      await docRef.set({ meals: data.meals || {}, inbody: data.inbody || [] }, { merge:true });
      const after = JSON.stringify(await fetchDoc()).length;
      log('저장 완료. 지금 문서 크기: <b>' + kb(after) + '</b>', 'g');
    }
    log('\n결과: 성공 ' + done + '장 / 실패 ' + failed + '장', failed ? 'r' : 'g');
    if(limit === 1 && done === 1){
      log('\n시험 이사 성공! 앱을 열어 그 사진이 잘 보이는지 확인한 뒤 [나머지 전부 이전]을 누르세요.', 'g');
    }
  }catch(e){
    log('이사 실패: ' + e.message, 'r'); console.error(e);
  }finally{
    document.getElementById('oneBtn').disabled = false;
    document.getElementById('allBtn').disabled = false;
  }
}

document.getElementById('oneBtn').addEventListener('click', function(){ migrate(1); });
document.getElementById('allBtn').addEventListener('click', function(){
  if(!confirm('문서에 남아 있는 사진을 전부 Storage로 옮깁니다.\n백업 JSON은 내려받아 두셨나요?')) return;
  migrate(null);
});

// ---- 되돌리기 ----
document.getElementById('restoreBtn').addEventListener('click', async ()=>{
  const f = document.getElementById('restoreFile').files[0];
  if(!f){ alert('백업 JSON 파일을 먼저 고르세요.'); return; }
  const typed = prompt('문서를 백업 시점으로 통째로 되돌립니다. 정말 되돌리려면  되돌리기  라고 입력하세요.');
  if(typed !== '되돌리기'){ log('되돌리기 취소됨.'); return; }
  try{
    const data = JSON.parse(await f.text());
    if(typeof data !== 'object' || data === null || Array.isArray(data)) throw new Error('올바른 백업 파일이 아닙니다.');
    await docRef.set(data);   // merge 없이 통째로 교체 = 백업 시점 그대로
    log('\n되돌리기 완료: ' + f.name, 'g');
  }catch(e){ log('되돌리기 실패: ' + e.message, 'r'); }
});
</script>
</body>
</html>
