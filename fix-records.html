<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>종목 기록 바로잡기 · 트레이닝 로그</title>
<style>
  :root{ --bg:#14181B; --card:#1C2226; --ink:#F2F0EA; --ink-dim:#93A0A8; --line:rgba(242,240,234,0.10);
         --accent:#E8A33D; --ok:#8FBF66; --warn:#C1666B; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:20px;line-height:1.6;}
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--ink-dim);font-size:13px;margin:0 0 20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--accent);letter-spacing:0.02em;}
  input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:#111518;color:var(--ink);font-size:15px;margin-bottom:8px;}
  button{width:100%;padding:13px;border-radius:9px;border:none;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;background:#2A3238;color:var(--ink);}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  button.primary{background:var(--accent);color:#14181B;}
  button.danger{background:var(--warn);color:#fff;}
  .log{background:#0E1215;border:1px solid var(--line);border-radius:9px;padding:12px;font-family:'IBM Plex Mono',Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto;color:var(--ink-dim);}
  .log b{color:var(--ink);} .log .g{color:var(--ok);} .log .r{color:var(--warn);} .log .y{color:var(--accent);}
  .hide{display:none;}
  .note{font-size:12.5px;color:var(--ink-dim);margin:6px 0 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔧 종목 기록 바로잡기</h1>
  <p class="sub">옛날 종목 목록이 바뀌면서 엉뚱한 이름에 붙어버린 운동 기록을, 기록에 남아있는 원래 이름대로 되돌립니다. · v2</p>

  <div class="card" id="loginCard">
    <h2>1. 로그인</h2>
    <input type="email" id="email" placeholder="이메일" autocomplete="username">
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password">
    <button class="primary" id="loginBtn">로그인</button>
    <p class="note" id="loginErr"></p>
  </div>

  <div class="card hide" id="workCard">
    <h2>2. 작업</h2>
    <button id="scanBtn">🔍 조사만 하기 (아무것도 안 바꿈)</button>
    <button id="backupBtn">💾 백업 JSON 내려받기</button>
    <button class="primary" id="fixBtn" disabled>🔧 바로잡기 실행</button>
    <p class="note">순서: 조사 → 백업 → 바로잡기. 운동 기록의 <b>종목 이름표만</b> 고치고, 무게·횟수·날짜는 손대지 않습니다.</p>
  </div>

  <div class="card hide" id="restoreCard">
    <h2>⚠️ 비상용 되돌리기</h2>
    <p class="note">내려받아둔 백업 JSON으로 문서를 통째로 되돌립니다.</p>
    <input type="file" id="restoreFile" accept="application/json,.json">
    <button class="danger" id="restoreBtn">♻️ 백업에서 되돌리기</button>
  </div>

  <div class="card">
    <h2>기록</h2>
    <div class="log" id="log">로그인을 먼저 해주세요.</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDB-qmTWEIPhdKc9xdcvBk6sjaXLSwIgOY",
  authDomain: "training-log-377f4.firebaseapp.com",
  projectId: "training-log-377f4",
  storageBucket: "training-log-377f4.firebasestorage.app",
  messagingSenderId: "286910060476",
  appId: "1:286910060476:web:4f93133b6348aaba557db9"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let docRef = null, uid = null;

const logEl = document.getElementById('log');
function log(msg, cls){
  logEl.innerHTML += (cls ? '<span class="' + cls + '">' : '') + msg + (cls ? '</span>' : '') + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog(){ logEl.innerHTML = ''; }

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const err = document.getElementById('loginErr'); err.textContent = '';
  try{ await auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(), document.getElementById('pw').value); }
  catch(e){ err.textContent = '로그인 실패: ' + e.message; }
});
auth.onAuthStateChanged(function(u){
  if(!u) return;
  uid = u.uid;
  docRef = db.collection('users').doc(uid).collection('log').doc('data');
  document.getElementById('loginCard').classList.add('hide');
  document.getElementById('workCard').classList.remove('hide');
  document.getElementById('restoreCard').classList.remove('hide');
  clearLog();
  log('로그인 완료. UID: ' + uid);
  log('먼저 [조사만 하기]를 눌러주세요.');
});

async function fetchDoc(){
  const snap = await docRef.get();
  if(!snap.exists) throw new Error('문서가 없습니다.');
  return snap.data();
}

// ---- 핵심 로직 ----
const norm = s => String(s || '').replace(/\s+/g, '').toLowerCase();
const hasValue = sets => (sets || []).some(s => s && (s.weight != null || s.reps != null || s.duration != null || s.distance != null));
function setsText(sets){
  return (sets || []).filter(s => s && (s.weight != null || s.reps != null || s.duration != null || s.distance != null))
    .map(s => {
      if(s.duration != null || s.distance != null) return [s.duration != null ? s.duration + '분' : '', s.distance != null ? s.distance + 'km' : ''].filter(Boolean).join(' ');
      if(s.weight != null) return s.weight + 'kg×' + (s.reps != null ? s.reps : '-') + '회';
      return (s.reps != null ? s.reps : '-') + '회';
    }).join(', ');
}

// 저장된 종목 목록에서 "이 이름의 진짜 주인 id"를 만든다.
function buildCanonical(data){
  const map = {}, dup = {};
  (data.masterExercises || []).forEach(e => {
    const k = norm(e.name);
    if(!k) return;
    if(map[k] && map[k].id !== e.id){ dup[k] = true; return; }
    map[k] = { id: e.id, name: e.name, type: e.type || 'strength' };
  });
  Object.keys(dup).forEach(k => delete map[k]);   // 이름이 겹쳐 애매한 건 건드리지 않음
  return { map: map, ambiguous: Object.keys(dup) };
}

// 고쳐야 할 기록 목록을 만든다 (아무것도 바꾸지 않음)
function buildPlan(data){
  const canon = buildCanonical(data);
  const moves = [], skipped = [];
  (data.entries || []).slice().sort((a,b) => a.date.localeCompare(b.date)).forEach(e => {
    const list = e.exercises || [];
    list.forEach((x, i) => {
      if(!x || !x.name) return;
      if(!hasValue(x.sets)) return;                       // 값이 빈 기록은 무시
      const c = canon.map[norm(x.name)];
      if(!c || c.id === x.id) return;                     // 이미 올바르거나, 대상 없음
      const clash = list.some((y, j) => j !== i && y && y.id === c.id);
      const typeNow = x.type || 'strength';
      if(clash){
        skipped.push({ date:e.date, name:x.name, why:'같은 날 이미 "' + c.name + '" 기록이 있어 자동 병합하지 않음' });
        return;
      }
      // 웨이트 ↔ 맨몸은 둘 다 '횟수' 기반이라 옮겨도 세트 내용이 그대로 살아난다.
      // 유산소만 시간·거리로 칸이 완전히 달라서 건드리지 않는다.
      const isCardio = t => t === 'cardio';
      if(isCardio(typeNow) !== isCardio(c.type)){
        skipped.push({ date:e.date, name:x.name, why:'유산소 ↔ 다른 종류라 안전상 건너뜀 (' + typeNow + ' → ' + c.type + ')' });
        return;
      }
      moves.push({ date:e.date, idx:i, fromId:x.id, toId:c.id, recordedName:x.name, newName:c.name,
                   oldType:typeNow, newType:c.type, sets:setsText(x.sets) });
    });
  });
  return { moves: moves, skipped: skipped, ambiguous: canon.ambiguous };
}

// ---- 조사 ----
document.getElementById('scanBtn').addEventListener('click', async ()=>{
  clearLog();
  try{
    log('문서를 읽는 중…');
    const data = await fetchDoc();
    const plan = buildPlan(data);
    log('운동 기록 ' + (data.entries || []).length + '일 · 종목 목록 ' + (data.masterExercises || []).length + '개\n');

    if(!plan.moves.length){
      log('바로잡을 기록이 없습니다. 이미 정리되어 있어요.', 'g');
    }else{
      log('<b>바로잡을 기록 ' + plan.moves.length + '건</b>');
      plan.moves.forEach((m, i) => {
        log('\n' + (i+1) + '. ' + m.date + '  기록에 적힌 이름: <b>' + m.recordedName + '</b>');
        log('     지금은 다른 종목(id=' + m.fromId + ')에 붙어 있음');
        log('     → <span class="y">"' + m.newName + '"</span> 으로 옮김'
          + (m.oldType !== m.newType ? '  (종류: ' + m.oldType + ' → ' + m.newType + ')' : ''));
        log('     세트(그대로 유지): ' + m.sets);
      });
    }
    if(plan.skipped.length){
      log('\n<b>건너뛰는 것 ' + plan.skipped.length + '건</b> (안전상 자동으로 안 고침)', 'y');
      plan.skipped.forEach(s => log('  · ' + s.date + ' "' + s.name + '" — ' + s.why));
    }
    if(plan.ambiguous.length){
      log('\n이름이 겹쳐 판단 불가한 종목: ' + plan.ambiguous.join(', '), 'y');
    }
    log('\n<b>아무것도 바꾸지 않았습니다.</b>', 'g');
    log('다음: [백업 JSON 내려받기] → [바로잡기 실행]');
    document.getElementById('fixBtn').disabled = plan.moves.length === 0;
  }catch(e){ log('조사 실패: ' + e.message, 'r'); console.error(e); }
});

// ---- 백업 ----
document.getElementById('backupBtn').addEventListener('click', async ()=>{
  try{
    const data = await fetchDoc();
    const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
    const d = new Date();
    const stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0')
                + '-' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0');
    const a = document.createElement('a');
    const href = URL.createObjectURL(blob);
    a.href = href; a.download = 'training-log-backup-' + stamp + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(href); }, 5000);
    log('\n백업 내려받기 완료: ' + a.download + ' (' + (blob.size/1024).toFixed(0) + 'KB)', 'g');
  }catch(e){ log('백업 실패: ' + e.message, 'r'); }
});

// ---- 실행 ----
document.getElementById('fixBtn').addEventListener('click', async ()=>{
  if(!confirm('운동 기록의 종목 이름표를 바로잡습니다.\n무게·횟수·날짜는 바뀌지 않습니다.\n백업 JSON은 내려받아 두셨나요?')) return;
  clearLog();
  document.getElementById('fixBtn').disabled = true;
  try{
    log('문서를 다시 읽는 중…');
    const data = await fetchDoc();
    const plan = buildPlan(data);
    if(!plan.moves.length){ log('바로잡을 기록이 없습니다.', 'g'); return; }

    // 세트 개수 합계를 미리 세어 두고, 작업 뒤 그대로인지 확인한다
    const countSets = d => (d.entries||[]).reduce((s,e)=> s + (e.exercises||[]).reduce((t,x)=> t + ((x.sets||[]).length), 0), 0);
    const before = countSets(data);

    plan.moves.forEach(m => {
      const entry = (data.entries || []).find(e => e.date === m.date);
      const x = entry && entry.exercises && entry.exercises[m.idx];
      if(!x || x.id !== m.fromId){ log('건너뜀(문서가 바뀜): ' + m.date + ' ' + m.recordedName, 'r'); return; }
      x.id = m.toId;
      x.name = m.newName;
      if(m.newType) x.type = m.newType;   // 기록에 적힌 옛 종류도 지금 기준으로 맞춘다
      log('✓ ' + m.date + '  "' + m.recordedName + '" → "' + m.newName + '"  (' + m.sets + ')', 'g');
    });

    const after = countSets(data);
    if(before !== after){ log('\n세트 개수가 달라졌습니다(' + before + '→' + after + '). 저장을 중단합니다.', 'r'); return; }

    log('\n저장하는 중… (entries만 저장, 나머지는 손대지 않음)');
    await docRef.set({ entries: data.entries }, { merge:true });
    log('저장 완료. 세트 ' + after + '개 그대로 유지됨.', 'g');
    log('\n앱을 새로고침하면 인버티드로우·암풀다운 기록이 온전히 보입니다.', 'g');
  }catch(e){
    log('바로잡기 실패: ' + e.message, 'r'); console.error(e);
  }finally{
    document.getElementById('fixBtn').disabled = false;
  }
});

// ---- 되돌리기 ----
document.getElementById('restoreBtn').addEventListener('click', async ()=>{
  const f = document.getElementById('restoreFile').files[0];
  if(!f){ alert('백업 JSON 파일을 먼저 고르세요.'); return; }
  const typed = prompt('문서를 백업 시점으로 통째로 되돌립니다. 정말 되돌리려면  되돌리기  라고 입력하세요.');
  if(typed !== '되돌리기'){ log('되돌리기 취소됨.'); return; }
  try{
    const data = JSON.parse(await f.text());
    if(typeof data !== 'object' || data === null || Array.isArray(data)) throw new Error('올바른 백업 파일이 아닙니다.');
    await docRef.set(data);
    log('\n되돌리기 완료: ' + f.name, 'g');
  }catch(e){ log('되돌리기 실패: ' + e.message, 'r'); }
});
</script>
</body>
</html>
