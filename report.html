<script>
window.__chartReady = false;
(function loadChart(){
  var cdns = [
    'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js',
    'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js',
    'https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js',
    'https://esm.sh/chart.js@4.4.4/dist/chart.umd.js'
  ];
  var i = 0;
  function tryNext(){
    if(typeof Chart !== 'undefined'){ onReady(); return; }
    if(i >= cdns.length){ console.error('모든 Chart CDN 실패'); return; }
    var s = document.createElement('script');
    s.src = cdns[i++];
    s.onload = function(){ if(typeof Chart!=='undefined') onReady(); else tryNext(); };
    s.onerror = tryNext;
    document.head.appendChild(s);
  }
  function onReady(){
    window.__chartReady = true;
    try{
      if(typeof renderGraph==='function' && document.getElementById('panel-graph') && document.getElementById('panel-graph').classList.contains('active')) renderGraph();
      if(typeof renderIbChart==='function' && document.getElementById('panel-inbody') && document.getElementById('panel-inbody').classList.contains('active')) renderIbChart();
    }catch(e){}
  }
  tryNext();
})();
</script>

<script>

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const DEFAULT_MASTER = [
  {id:'bench',name:'벤치프레스',part:'가슴',type:'strength'},{id:'ohp',name:'오버헤드프레스',part:'어깨',type:'strength'},{id:'pushdown',name:'케이블 푸쉬다운',part:'삼두',type:'strength'},
  {id:'row',name:'인버티드로우',part:'등',type:'strength'},{id:'latpull',name:'암풀다운',part:'등',type:'strength'},{id:'squat',name:'가블릿스쿼트',part:'하체',type:'strength'}
];
const DAY_NAMES = ['일','월','화','수','목','금','토'];
let CUP_ML = 165;
let entries = [], water = {}, masterExercises = [], inbody = [], meals = {}, dailyItems = [];

function dayOfWeek(dateStr){ return new Date(dateStr+'T00:00:00').getDay(); }
function allExercises(){ return masterExercises; }
function exById(id){ return masterExercises.find(e=>e.id===id)||null; }
function exType(ex){ return (ex && ex.type)==='cardio' ? 'cardio' : ((ex && ex.type)==='bodyweight'?'bodyweight':'strength'); }
// 종목의 종류는 "지금의 라이브러리"를 기준으로 판단한다.
// 기록에 저장된 type은 그 당시 값이라 낡았을 수 있다(예: 인버티드로우가 웨이트→맨몸으로 바뀜).
function exTypeOf(ex){
  const master = exById(ex && ex.id);
  return exType(master || ex);
}
// 이름도 "지금의 라이브러리"를 먼저 본다.
function exNameOf(ex){
  const master = exById(ex && ex.id);
  return (master && master.name) || (ex && ex.name) || '';
}
// ---------- 시간 기록 공통 ----------
// 세트 시각·식사 시각은 'HH:MM'(24시간) 문자열로 저장한다.
function hhmmToMin(t){
  if(!t || !/^\d{1,2}:\d{2}$/.test(t)) return null;
  const p = t.split(':');
  return parseInt(p[0],10)*60 + parseInt(p[1],10);
}
function minToText(mins){
  if(mins == null) return '';
  if(mins < 0) mins += 24*60;              // 자정을 넘긴 경우
  const h = Math.floor(mins/60), m = mins%60;
  return h ? (h + '시간' + (m ? ' ' + m + '분' : '')) : (m + '분');
}
// 식단 사진: 예전 기록은 주소 문자열, v24부터는 {u:주소, t:'HH:MM'}
function photoUrl(p){ return typeof p === 'string' ? p : ((p && p.u) || ''); }
function photoTime(p){ return (p && typeof p === 'object' && p.t) ? p.t : ''; }
function slotTime(imgs){
  const ts = (imgs||[]).map(photoTime).filter(Boolean).sort();
  return ts.length ? ts[0] : '';
}
function setTimesHtml(ex){
  const ts = (ex.sets||[]).map(s => s && s.t).filter(Boolean);
  if(!ts.length) return '';
  const gaps = [];
  for(let i=1;i<ts.length;i++){
    const d = hhmmToMin(ts[i]) - hhmmToMin(ts[i-1]);
    if(d != null) gaps.push(minToText(d));
  }
  return '<div class="hx-time">⏱ ' + ts.join(' → ')
       + (gaps.length ? ' <span class="rest">쉼 ' + gaps.join(', ') + '</span>' : '') + '</div>';
}
function dayTimeRange(e){
  const ts = [];
  (e.exercises||[]).forEach(x => (x.sets||[]).forEach(s => { if(s && s.t) ts.push(s.t); }));
  if(!ts.length) return '';
  ts.sort();
  if(ts.length === 1) return ts[0];
  const span = hhmmToMin(ts[ts.length-1]) - hhmmToMin(ts[0]);
  return ts[0] + '–' + ts[ts.length-1] + (span > 0 ? ' (' + minToText(span) + ')' : '');
}
function setsToText(ex){
  const t = exTypeOf(ex);
  if(t==='cardio'){
    return (ex.sets||[]).filter(s=>s.duration||s.distance)
      .map(s=>[s.duration!=null?s.duration+'분':'', s.distance!=null?s.distance+'km':''].filter(Boolean).join(' ')).filter(Boolean).join(', ');
  }
  if(t==='bodyweight'){
    // 예전에 무게를 넣어둔 기록이면 그 무게도 함께 보여준다
    return (ex.sets||[]).filter(s=>s.reps!=null)
      .map(s=> (s.weight!=null && s.weight>0 ? s.weight+'kg×' : '') + s.reps + '회').join(', ');
  }
  return (ex.sets||[]).filter(s=>s.weight||s.reps).map(s=>`${s.weight??'-'}kg×${s.reps??'-'}`).join(', ');
}
// 작은 추이 그래프 — 외부 라이브러리 없이 SVG로 직접 그린다
function sparklineSvg(points, w, h, markIdx){
  const vals = points.map(p => p.top);
  const pad = 3;
  const mi = (markIdx == null) ? vals.length - 1 : markIdx;
  if(vals.length === 1){
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" aria-hidden="true">'
         + '<circle cx="' + (w/2) + '" cy="' + (h/2) + '" r="2.6" fill="var(--accent-a)"/></svg>';
  }
  const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals), flat = (max === min);
  const X = i => pad + i * (w - 2*pad) / (vals.length - 1);
  const Y = v => flat ? (h/2) : (h - pad) - ((v - min) / (max - min)) * (h - 2*pad);
  const line = vals.map((v,i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" aria-hidden="true">'
       + '<polyline points="' + line + '" fill="none" stroke="var(--accent-a)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>'
       + '<circle cx="' + X(mi).toFixed(1) + '" cy="' + Y(vals[mi]).toFixed(1) + '" r="2.4" fill="var(--accent-a)"/></svg>';
}
// 기록 보기: 웨이트 종목 옆에 붙는 중량 추이 미니 그래프.
// 그 종목의 전체 추이를 그리고, 그날 기록의 위치를 점으로 표시한다.
// 그날의 대표 세트 = 가장 무거운 세트 (같은 무게면 횟수가 많은 쪽)
function topSetText(ex){
  const sets = (ex.sets||[]).filter(s => s && s.weight != null && !isNaN(s.weight));
  if(!sets.length) return '';
  let best = sets[0];
  sets.forEach(s => {
    if(s.weight > best.weight || (s.weight === best.weight && (s.reps||0) > (best.reps||0))) best = s;
  });
  return best.weight + 'kg×' + (best.reps != null ? best.reps : '-') + '회';
}
function histSparkHtml(ex, dateStr){
  const master = exById(ex && ex.id);
  if(!master || exType(master) !== 'strength') return '';
  const pts = exerciseSeries(ex.id);
  if(pts.length < 2) return '';
  const idx = pts.findIndex(p => p.date === dateStr);
  if(idx < 0) return '';
  const best = Math.max.apply(null, pts.map(p => p.top));
  const isBest = pts[idx].top >= best;   // 이날이 역대 최고면 표시
  const title = '중량 추이 ' + pts.length + '회 · 이날 ' + pts[idx].top + 'kg / 최고 ' + best + 'kg';
  const val = topSetText(ex);
  // 휴대폰에선 마우스를 올릴 수 없으므로 점 옆에 숫자를 직접 적는다
  return '<span class="hx-spark" title="' + title + '">' + sparklineSvg(pts, 44, 16, idx)
       + (val ? '<b class="hx-val' + (isBest ? ' best' : '') + '">' + val + (isBest ? ' 🔥' : '') + '</b>' : '')
       + '</span>';
}

function dailySetsToText(item, sets){
  if(!sets || !sets.length) return '';
  if(item.type==='bodyweight'){
    const reps = sets.filter(s=>s.reps!=null).map(s=>s.reps);
    return reps.length ? reps.join(', ')+'회' : '';
  }else if(item.type==='cardio'){
    return sets.filter(s=>s.duration!=null||s.distance!=null)
      .map(s=>[s.duration!=null?s.duration+'분':'', s.distance!=null?s.distance+'km':''].filter(Boolean).join(' ')).filter(Boolean).join(', ');
  }
  return sets.filter(s=>s.weight!=null||s.reps!=null).map(s=>`${s.weight??'-'}kg×${s.reps??'-'}`).join(', ');
}
function dailyToText(e){
  const parts = [];
  if(e.daily){
    dailyItems.forEach(item=>{
      const txt = dailySetsToText(item, e.daily[item.id]);
      if(txt) parts.push(`<b>${item.name}</b> ${txt}`);
    });
  }else{
    const wgsDone = e.wgs ? e.wgs.filter(Boolean).length : 0;
    if(wgsDone) parts.push(`<b>WGS스트레칭</b> ${wgsDone}세트`);
    if(e.cardio!=null) parts.push(`<b>러닝머신</b> ${e.cardio}분`);
  }
  return parts.join(' · ');
}

let historyFilter = 'all';
let openMonths = {};

function entryCardHTML(e){
  const dow = DAY_NAMES[dayOfWeek(e.date)];
  const tag = e.pt ? 'PT' : e.group;
  const timeRange = dayTimeRange(e);   // 그날 첫 세트 ~ 마지막 세트
  let body = '';
  if(e.exercises){
    const rows = e.exercises.map(ex=>{
      const setsTxt = setsToText(ex);
      if(!setsTxt) return '';
      return `<div class="hx-row"><span class="hx-txt"><b>${exNameOf(ex)}</b> ${setsTxt}</span>${histSparkHtml(ex, e.date)}</div>${setTimesHtml(ex)}`;
    }).filter(Boolean);
    body += rows.join('');
    if(!rows.length) body += `<div style="color:var(--ink-faint);font-size:12.5px;">기록한 운동 없음</div>`;
  }
  const w = water[e.date] || 0;
  const dailyTxt = dailyToText(e);
  if(dailyTxt) body += `<div style="margin-top:6px;">${dailyTxt}</div>`;
  body += `<div style="margin-top:2px;"><b>수분</b> ${w}잔 (${w*CUP_ML}ml)</div>`;
  // 식단 사진
  const mm = meals[e.date];
  let mealHtml = '';
  if(mm){
    const slots = [['breakfast','아침'],['snackAM','간식 · 오전'],['lunch','점심'],['snackPM','간식 · 오후'],
                   ['dinner','저녁'],['snackNight','간식 · 저녁 이후'],['snack','간식']];
    let prevMin = null;   // 앞 끼니 시각 (먹는 텀 계산용)
    const rows = slots.map(([k,lbl])=>{
      const imgs = mm[k]||[];
      if(!imgs.length) return '';
      const thumbs = imgs.map(p=>{
        const pt = photoTime(p);
        return `<span style="display:inline-block;position:relative;line-height:0;"><img class="meal-photo" src="${photoUrl(p)}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:zoom-in;display:block;">${pt?`<span class="mtime">${pt}</span>`:''}</span>`;
      }).join('');
      const st = slotTime(imgs);
      let timeHtml = '';
      if(st){
        const cur = hhmmToMin(st);
        const gap = (prevMin != null && cur != null) ? ` <span class="mgap">+${minToText(cur - prevMin)}</span>` : '';
        timeHtml = ` <span class="mslot-time">${st}</span>${gap}`;
        if(cur != null) prevMin = cur;
      }
      return `<div style="margin-top:6px;"><span style="font-size:12px;color:var(--ink-dim);">${lbl}${timeHtml}</span><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;">${thumbs}</div></div>`;
    }).filter(Boolean).join('');
    if(rows) mealHtml = `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);"><b style="font-size:12.5px;">🍽️ 식단</b>${rows}</div>`;
  }
  return `
    <div class="hist-entry">
      <div class="hist-top">
        <span class="hist-date">${e.date} (${dow})</span>
        <span class="hist-tag ${tag}">${tag}</span>
        ${timeRange?`<span class="hist-time">${timeRange}</span>`:''}
      </div>
      <div class="hist-body">${body}</div>
      ${mealHtml}
      ${e.note?`<div class="hist-note">📝 ${e.note}</div>`:''}
    </div>`;
}

function renderHistorySummary(){

function renderHistoryFilter(){
  const wrap = document.getElementById('historyFilter');
  const opts = [['all','전체'],['A','A'],['B','B'],['PT','PT']];
  wrap.innerHTML = opts.map(([v,l])=>`<div class="fbtn ${historyFilter===v?'on':''}" data-f="${v}">${l}</div>`).join('');
  wrap.querySelectorAll('.fbtn').forEach(btn=>{
    btn.onclick = ()=>{ historyFilter = btn.dataset.f; renderHistory(); };
  });
}

function renderHistory(){
  renderHistorySummary();
  renderHistoryFilter();
  const wrap = document.getElementById('historyList');
  let list = [...entries].sort((a,b)=>b.date.localeCompare(a.date));
  if(historyFilter==='PT') list = list.filter(e=>e.pt);
  else if(historyFilter==='A') list = list.filter(e=>!e.pt && e.group==='A');
  else if(historyFilter==='B') list = list.filter(e=>!e.pt && e.group==='B');

  if(!list.length){ wrap.innerHTML = '<div class="empty">해당하는 기록이 없어요.</div>'; return; }

  const byMonth = {};
  list.forEach(e=>{ const ym=e.date.slice(0,7); (byMonth[ym]=byMonth[ym]||[]).push(e); });
  const months = Object.keys(byMonth).sort((a,b)=>b.localeCompare(a));
  if(Object.keys(openMonths).length===0 && months.length) openMonths[months[0]] = true;

  wrap.innerHTML = months.map(ym=>{
    const [y,m] = ym.split('-');
    const isOpen = !!openMonths[ym];
    const cards = byMonth[ym].map(entryCardHTML).join('');
    return `
      <div class="month-group ${isOpen?'open':''}" data-ym="${ym}">
        <div class="month-head">
          <span class="mtitle">${y}년 ${parseInt(m)}월</span>
          <span><span class="mcount">${byMonth[ym].length}건</span> <span class="chev">▶</span></span>
        </div>
        <div class="month-body">${cards}</div>
      </div>`;
  }).join('');

  wrap.querySelectorAll('.month-head').forEach(head=>{
    head.onclick = ()=>{
      const ym = head.parentElement.dataset.ym;
      openMonths[ym] = !openMonths[ym];
      head.parentElement.classList.toggle('open', openMonths[ym]);
    };
  });
}

const CHART_COLORS = ['#E8A33D','#4FA8A0','#A78BD4','#C1666B','#6FB8DE','#8FBF66','#D98C5F','#7F9CF5'];
function padSingle(labels, datasets){
  if(labels.length !== 1) return { labels, datasets };
  return { labels:['', labels[0], ''], datasets: datasets.map(ds=>({ ...ds, data:[null, ds.data[0], null] })) };
}
const TOOLTIP_STYLE = {
  backgroundColor:'#2C333A', titleColor:'#F2F0EA', bodyColor:'#93A0A8',
  borderColor:'rgba(242,240,234,0.2)', borderWidth:1, padding:10,
  titleFont:{family:'IBM Plex Sans KR', size:13}, bodyFont:{family:'IBM Plex Sans KR', size:12}
};
let chartInstance = null;
function populateExerciseSelect(){
  const sel = document.getElementById('exerciseSelect');
  const opts = ['<option value="__all__">전체 (모든 종목)</option>']
    .concat(allExercises().map(ex=>`<option value="${ex.id}">${ex.name}</option>`));
  sel.innerHTML = opts.join('');
}
function exerciseSeries(exId){
  const points = [];
  entries.filter(e=>e.exercises).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const ex = e.exercises.find(x=>x.id===exId);
    if(!ex || !Array.isArray(ex.sets)) return;
    const t = exTypeOf({ id:exId, type:ex.type });
    if(t==='cardio'){
      const durs = ex.sets.map(s=>s&&s.duration).filter(v=>v!=null && !isNaN(v));
      if(!durs.length) return;
      const setsText = ex.sets.filter(s=>s&&(s.duration!=null||s.distance!=null))
        .map(s=>[s.duration!=null?s.duration+'분':'', s.distance!=null?s.distance+'km':''].filter(Boolean).join(' ')).filter(Boolean).join(', ');
      points.push({ date:e.date, top: Math.max(...durs), setsText, unit:'분' });
    }else if(t==='bodyweight'){
      const reps = ex.sets.map(s=>s&&s.reps).filter(v=>v!=null && !isNaN(v));
      if(!reps.length) return;
      const bwText = ex.sets.filter(s=>s&&s.reps!=null)
        .map(s=> (s.weight!=null && s.weight>0 ? s.weight+'kg×' : '') + s.reps + '회').join(', ');
      points.push({ date:e.date, top: Math.max(...reps), setsText: bwText, unit:'회' });
    }else{
      const weights = ex.sets.map(s=>s&&s.weight).filter(w=>w!=null && !isNaN(w));
      if(!weights.length) return;
      const setsText = ex.sets.filter(s=>s&&(s.weight!=null||s.reps!=null))
        .map(s=>`${s.weight??'-'}kg×${s.reps??'-'}회`).join(', ');
      points.push({ date:e.date, top: Math.max(...weights), setsText, unit:'kg' });
    }
  });
  return points;
}
function renderGraph(){
  const statRow = document.getElementById('statRow');
  try{
    if(typeof Chart === 'undefined'){ statRow.innerHTML = '<div class="empty" style="width:100%;">차트를 불러오는 중이에요… 잠시 후 자동으로 표시돼요. (안 나오면 새로고침)</div>'; return; }

    if(chartInstance) chartInstance.destroy();

    if(val === '__all__'){
      const dateSet = new Set(); const perEx = {};
      allExercises().forEach(ex=>{
        const s = exerciseSeries(ex.id);
        if(s.length){ perEx[ex.id]={name:ex.name, map:Object.fromEntries(s.map(p=>[p.date,p.top])), sets:Object.fromEntries(s.map(p=>[p.date,p.setsText]))}; s.forEach(p=>dateSet.add(p.date)); }
      });
      const dates=[...dateSet].sort(); const exIds=Object.keys(perEx);
      if(!exIds.length){
        statRow.innerHTML = '<div class="empty" style="width:100%;">아직 무게 기록이 없어요.</div>';

        return;
      }
      const nameToId = {};
      const datasets = exIds.map((id,i)=>{ const c=CHART_COLORS[i%CHART_COLORS.length]; nameToId[perEx[id].name]=id;
        return {label:perEx[id].name, data:dates.map(d=>perEx[id].map[d]??null), borderColor:c, backgroundColor:c, tension:0.3, fill:false, pointRadius:5, pointHoverRadius:7, pointBackgroundColor:c, spanGaps:true}; });
      const padded = padSingle(dates, datasets);
      chartInstance = new Chart(ctx,{ type:'line', data:{labels:padded.labels, datasets:padded.datasets},
        options:{ interaction:{mode:'nearest',intersect:false},
          plugins:{legend:{display:true, labels:{color:'#93A0A8', font:{size:11}, boxWidth:12}},
            tooltip:{ ...TOOLTIP_STYLE, callbacks:{
              title:(items)=> items.length?items[0].label:'',
              label:(item)=> `${item.dataset.label} · 최고 ${item.parsed.y}kg`,
              afterLabel:(item)=>{ const id=nameToId[item.dataset.label]; const st=id&&perEx[id].sets[item.label]; return st?'세트: '+st:''; }
            }}},
          scales:{ x:{ticks:{color:'#93A0A8',font:{family:'IBM Plex Mono', size:10}},grid:{color:'rgba(242,240,234,0.06)'}},
                   y:{ticks:{color:'#93A0A8',font:{family:'IBM Plex Mono'}},grid:{color:'rgba(242,240,234,0.06)'}} } } });

      return;
    }

    const points = exerciseSeries(val);
    if(!points.length){
      chartInstance = new Chart(ctx, { type:'line', data:{labels:[],datasets:[]}, options:{plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}}} });
      statRow.innerHTML = '<div class="empty" style="width:100%;">이 운동에 대한 기록이 아직 없어요.</div>';
      return;
    }
    const setsByDate = Object.fromEntries(points.map(p=>[p.date, p.setsText]));
    const base={ labels: points.map(p=>p.date),
      datasets:[{ label:'최고 세트 무게(kg)', data: points.map(p=>p.top),
        borderColor:'#E8A33D', backgroundColor:'rgba(232,163,61,0.15)',
        tension:0.3, fill:true, pointRadius:5, pointHoverRadius:7, pointBackgroundColor:'#E8A33D' }] };
    const padded = padSingle(base.labels, base.datasets);
    chartInstance = new Chart(ctx, {
      type:'line', data: padded,
      options:{ interaction:{mode:'nearest',intersect:false},
        plugins:{legend:{display:false},
          tooltip:{ ...TOOLTIP_STYLE, callbacks:{
            title:(items)=> items.length?items[0].label:'',
            label:(item)=> `최고 ${item.parsed.y}kg`,
            afterLabel:(item)=>{ const st=setsByDate[item.label]; return st?'세트: '+st:''; }
          }}},
        scales:{ x:{ticks:{color:'#93A0A8',font:{family:'IBM Plex Mono', size:10}},grid:{color:'rgba(242,240,234,0.06)'}},
                 y:{ticks:{color:'#93A0A8',font:{family:'IBM Plex Mono'}},grid:{color:'rgba(242,240,234,0.06)'}} } }
    });
    const first=points[0].top, last=points[points.length-1].top, max=Math.max(...points.map(p=>p.top));
    statRow.innerHTML = `
      <div class="stat"><div class="v">${last}kg</div><div class="l">최근 기록</div></div>
      <div class="stat"><div class="v">${max}kg</div><div class="l">최고 기록</div></div>
      <div class="stat"><div class="v">${last-first>=0?'+':''}${(last-first).toFixed(1)}kg</div><div class="l">전체 변화</div></div>
    `;
  }catch(err){
    statRow.innerHTML = '<div class="empty" style="width:100%;color:var(--accent-pt);">차트 오류: '+(err&&err.message?err.message:err)+'</div>';
  }
}

function renderIbLatestReport(){

      diffHtml=`<div class="mdiff ${cls}">${d>0?'▲ +':d<0?'▼ ':''}${d===0?'변화 없음':Math.abs(d)+m.unit}</div>`; }
    return `<div class="ib-metric"><div class="mlabel">${m.label}</div><div class="mval">${v}<span class="u">${m.unit}</span></div>${diffHtml}</div>`;
  }).filter(Boolean).join('');
  wrap.innerHTML = `<div class="ib-latest-card">
    <div class="ib-latest-head"><span class="t">최근 인바디</span><span class="d">${latest.date}</span></div>

  try{
    const snap = await db.collection('users').doc(uid).collection('log').doc('data').get();
    const data = snap.exists ? snap.data() : {};
    entries = data.entries || [];
    water = data.water || {};
    if(typeof data.cupMl === 'number' && data.cupMl > 0) CUP_ML = data.cupMl;
    inbody = data.inbody || [];
    dailyItems = Array.isArray(data.dailyItems) ? data.dailyItems : [];
    meals = data.meals || {};
    if(Array.isArray(data.masterExercises) && data.masterExercises.length){
      masterExercises = data.masterExercises;
    }else{
      masterExercises = DEFAULT_MASTER.map(e=>({...e}));
      (data.customExercises||[]).forEach(c=>{
        masterExercises.push({id:c.id, name:c.name.replace(/^\d+\.\s*/,''), part:''});
      });
    }
    // 기록에 등장한 종목은 항상 목록에 흡수(그래프 드롭다운/타입 판정용)
    const seen = new Set(masterExercises.map(m=>m.id));
    entries.forEach(en=>(en.exercises||[]).forEach(ex=>{
      if(!seen.has(ex.id)){ masterExercises.push({id:ex.id, name:(ex.name||'').replace(/^\d+\.\s*/,''), part:ex.part||'', type:ex.type||'strength'}); seen.add(ex.id); }
    }));
  }catch(e){
    notice.style.display = 'block';
    if(e && (e.code==='permission-denied' || /permission/i.test(e.message||''))){
      notice.textContent = '데이터 읽기 권한이 없어요. Firebase 콘솔 > Firestore Database > 규칙에서 allow read: if true; 규칙을 게시해야 합니다.';
    }else{
      notice.textContent = '데이터를 불러오지 못했어요: ' + (e&&e.message?e.message:e);
    }
  }
  renderHistory();
  populateExerciseSelect();
})();

// 이미지 확대(라이트박스)
(function(){
  const lb = document.createElement('div');
  lb.className = 'lightbox'; lb.id = 'lightbox';
  lb.innerHTML = '<img id="lightboxImg" src=""><button class="lightbox-close" id="lightboxClose">×</button>';
  document.body.appendChild(lb);
  function close(){ lb.classList.remove('on'); document.getElementById('lightboxImg').src=''; }
  document.getElementById('lightboxClose').addEventListener('click', close);
  lb.addEventListener('click', (e)=>{ if(e.target.id==='lightbox') close(); });
  document.addEventListener('click', (e)=>{
    const img = e.target;
    if(img.tagName!=='IMG') return;
    if(img.classList.contains('meal-photo') || img.classList.contains('ib-latest-img')){
      document.getElementById('lightboxImg').src = img.src;
      lb.classList.add('on');
    }
  });
})();
</script>
